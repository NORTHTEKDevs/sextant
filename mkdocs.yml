site_name: sextant
site_description: Reliability primitives for any LLM API
site_url: https://NORTHTEKDevs.github.io/sextant/
repo_url: https://github.com/NORTHTEKDevs/sextant
repo_name: NORTHTEKDevs/sextant
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Primitives:
      - cove: primitives/cove.md
      - self_consistency: primitives/self_consistency.md
      - best_of_n: primitives/best_of_n.md
      - reflexion: primitives/reflexion.md
      - debate: primitives/debate.md
      - DriftDetector: primitives/drift.md
      - race: primitives/race.md
  - Adapters: adapters.md
  - Async: async.md
  - Tracing: tracing.md
  - CLI: cli.md
  - Changelog: changelog.md

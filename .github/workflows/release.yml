name: Release to PyPI

# Tag-driven release using PyPI Trusted Publishing (OIDC, no manual token).
# Before this works, you must register the pending publisher at:
#   https://pypi.org/manage/account/publishing/
#   PyPI Project Name:   lemmas
#   Owner:               NORTHTEKDevs
#   Repository name:     lemmas
#   Workflow filename:   release.yml
#   Environment name:    pypi
#
# Cut a release by pushing a tag like:  git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lemmas
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
